     ▸ 有背景图时：把图放到 assets/bg.jpg，即可自动作为最下层背景。

<!-- ============================================================
     主界面
     空间关系对齐母版：标题 / 资源 → 五格 Actions → 总计 → 分隔
     → 搜索·筛选 → 横向 Mod Card 网格 ＋ 右侧大型 Preview（结果）
     → 底部操作（熔接 / 快速选择 / 清空 / 退出）
     ============================================================ -->
<div class="deck" id="deck">

  <header class="topbar">
    <div class="brand">
      <span class="brand-emblem"><svg viewBox="0 0 24 24"><use href="#i-emblem"/></svg></span>
      <span class="brand-warn" title="配方数据来自开发者工坊，正式上线前可能调整"><svg viewBox="0 0 24 24"><use href="#i-warn"/></svg></span>
      <h1 class="brand-title">裂罅 <span class="slash">/</span> <em>熔接</em></h1>
      <span class="brand-mini" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="purse">
      <span class="purse-item" title="基础词条总数"><svg viewBox="0 0 24 24"><use href="#i-list"/></svg><b id="cStat">22</b></span>
      <span class="purse-item" title="熔接配方总数"><svg viewBox="0 0 24 24"><use href="#i-fuse"/></svg><b id="cRecipe">22</b></span>
      <span class="purse-item" title="融合属性总数"><svg viewBox="0 0 24 24"><use href="#i-gem"/></svg><b id="cOut">18</b></span>
    </div>
  </header>

  <section class="actionbar">
    <div class="action-list" id="actionList" role="tablist" aria-label="查询模式与资料">
      <button class="action on" data-mode="fwd" role="tab" aria-selected="true">
        <span class="a-cap">查询模式</span>
        <span class="a-art"><svg viewBox="0 0 24 24"><use href="#i-fuse"/></svg><svg class="a-chev" viewBox="0 0 24 24"><use href="#i-chev"/></svg><svg viewBox="0 0 24 24"><use href="#i-riven"/></svg></span>
        <span class="a-note">选择 2 条词条 · 熔接出融合词条</span>
      </button>
      <button class="action" data-mode="rev" role="tab" aria-selected="false">
        <span class="a-cap">查询模式</span>
        <span class="a-art"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg><svg class="a-chev" viewBox="0 0 24 24"><use href="#i-chev"/></svg><svg viewBox="0 0 24 24"><use href="#i-fuse"/></svg></span>
        <span class="a-note">选择融合词条 · 反查所有配方</span>
      </button>
      <button class="action" data-panel="mech">
        <span class="a-cap">资料</span>
        <span class="a-art"><svg viewBox="0 0 24 24"><use href="#i-book"/></svg></span>
        <span class="a-note">新机制介绍</span>
      </button>
      <button class="action" data-panel="rules">
        <span class="a-cap">资料</span>
        <span class="a-art"><svg viewBox="0 0 24 24"><use href="#i-rules"/></svg></span>
        <span class="a-note">核心规则 5 条</span>
      </button>
      <button class="action" data-coach>
        <span class="a-cap">教程</span>
        <span class="a-art"><svg viewBox="0 0 24 24"><use href="#i-route"/></svg></span>
        <span class="a-note">快速上手</span>
      </button>
    </div>

    <div class="totals">
      <span class="totals-line">
        <span class="tl">总计</span><b id="tTotal">22</b>
        <span class="tl">显示</span><b id="tShow">22</b>
        <span class="tl">已选</span><b id="tPick">0</b><span class="tl" id="tPickSlash">/</span><b id="tPickMax">2</b>
      </span>
      <svg class="totals-caret" viewBox="0 0 24 24"><use href="#i-caret"/></svg>
    </div>
  </section>

  <div class="seam"><span id="seamLabel">裂罅词条</span></div>

  <section class="filterbar">
    <label class="search">
      <input id="searchInput" type="search" placeholder="搜寻…" autocomplete="off" spellcheck="false" aria-label="搜寻词条">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
    </label>

    <div class="cat-icons" id="catIcons" role="group" aria-label="词条类别过滤">
      <button class="ci on" data-group="all" title="全部类别" aria-label="全部类别" aria-pressed="true"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg></button>
      <button class="ci" data-group="element" title="元素" aria-label="元素" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-element"/></svg></button>
      <button class="ci" data-group="faction" title="阵营" aria-label="阵营" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-faction"/></svg></button>
      <button class="ci" data-group="gun" title="枪械" aria-label="枪械" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-gun"/></svg></button>
      <button class="ci" data-group="melee" title="近战" aria-label="近战" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-blade"/></svg></button>
      <span class="ci-legend" id="ciLegend">全部</span>
    </div>

    <label class="picker">
      <span class="picker-cap">武器类型</span>
      <span class="picker-field">
        <select id="wpSelect" aria-label="武器类型">
          <option value="all">全部武器</option>
          <option value="gun">枪械</option>
          <option value="melee">近战</option>
        </select>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-caret"/></svg>
      </span>
    </label>
  </section>

  <!-- 主区：左 = 浏览/搜索/筛选/选择；右 = 大型 Preview = 查询结果 -->
  <main class="body">
    <div class="grid-wrap">
      <div class="mod-grid" id="modGrid" role="listbox" aria-label="裂罅词条" aria-multiselectable="true"></div>
      <p class="grid-empty" id="gridEmpty" hidden>没有匹配的词条 —— 换个关键词，或切回「全部类别」。</p>
    </div>
    <div class="result" id="resultPane" aria-live="polite" aria-label="查询结果"></div>
  </main>

  <footer class="bottombar">
    <div class="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-info"/></svg>
      <span id="statusText">就绪 · 选择两条词条后自动查询</span>
      <span class="status-hint" id="statusHint" hidden>点击词条右上角 ＋ / − 切换极性</span>
    </div>
    <button class="clear-btn" id="clearBtn">清空选择</button>
  </footer>
</div>


<!-- ============================================================
     快速上手（首次使用教程）
     叠加在真实界面上：四片压暗遮罩 + 挖空高亮圈 + 小型说明框。
     遮罩只挡住高亮区以外的地方，高亮目标本身仍然是真实可点的元素。
     ============================================================ -->
<div class="coach" id="coach" hidden>
  <div class="coach-mask" id="coachMask" aria-hidden="true">
    <i class="cm cm-t"></i><i class="cm cm-b"></i><i class="cm cm-l"></i><i class="cm cm-r"></i>
  </div>
  <div class="coach-ring off" id="coachRing" aria-hidden="true"></div>
  <div class="coach-ring2 off" id="coachRing2" aria-hidden="true"></div>
  <div class="coach-card" id="coachCard" role="dialog" aria-label="快速上手">
    <span class="coach-arrow" id="coachArrow" aria-hidden="true"></span>
    <div class="coach-step" id="coachStep"></div>
    <h3 class="coach-title" id="coachTitle"></h3>
    <div class="coach-body" id="coachBody"></div>
    <div class="coach-foot">
      <button class="coach-skip" id="coachSkip">跳过</button>
      <div class="coach-acts">
        <button class="coach-link" id="coachGuide" hidden>洗卡策略 →</button>
        <button class="coach-next" id="coachNext">开始</button>
      </div>
    </div>
  </div>
</div>

<!-- 资料覆盖层（机制 / 规则 / 洗卡教程） -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <header class="ov-head">
      <span class="ov-cap" id="ovCap">资料</span>
      <h2 class="ov-title" id="ovTitle"></h2>
      <button class="ov-close" id="ovClose" aria-label="关闭"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </header>
    <div class="ov-body" id="ovBody"></div>
    <footer class="ov-foot" id="ovFoot"></footer>
  </div>
</div>
